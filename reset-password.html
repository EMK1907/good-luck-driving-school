<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Set a new instructor password for Good Luck Driving School." />
    <meta name="robots" content="noindex, nofollow" />
    <title>Choose a New Password | Good Luck Driving School</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header is-scrolled" data-header>
      <nav class="nav shell" aria-label="Instructor password reset navigation">
        <a class="brand" href="index.html#home" aria-label="Good Luck Driving School home">
          <img src="assets/brand/good-luck-logo.png" alt="" aria-hidden="true" class="brand-logo" />
          <span>
            <strong>Good Luck</strong>
            <small>Driving School</small>
          </span>
        </a>

        <div class="nav-links auth-nav">
          <a href="instructor-login.html">Instructor Login</a>
        </div>
      </nav>
    </header>

    <main id="main">
      <section class="auth-hero">
        <div class="shell auth-layout">
          <div class="section-copy reveal">
            <p class="eyebrow">Instructor Area</p>
            <h1>Choose a New Password</h1>
            <p>Enter a new password for your instructor account.</p>
          </div>

          <form class="contact-form auth-card reveal" data-reset-password-form>
            <label>
              New password
              <input type="password" name="password" autocomplete="new-password" required minlength="8" />
            </label>
            <label>
              Confirm new password
              <input type="password" name="confirmPassword" autocomplete="new-password" required minlength="8" />
            </label>
            <p class="auth-status" data-reset-status hidden></p>
            <button class="button primary" type="submit" disabled>Update Password</button>
            <p class="form-note">
              Already updated your password?
              <a class="text-link" href="instructor-login.html">Return to instructor login</a>.
            </p>
          </form>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="reset-password.js"></script>
    <script src="script.js"></script>
  </body>
</html>
